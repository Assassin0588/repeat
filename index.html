<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input style="display: block; margin: 0 auto; width: 50%; padding: 10px; border-radius: 20px; border: 2px solid rgb(141, 34, 34);" type="text" name="command" id="command" placeholder="Enter Your Command">
    <div style="display: flex; justify-content: center; gap: 10px; margin: 10px auto;">
        <button style="padding: 10px 20px; background: rgb(141, 34, 34); color:white; border-radius: 20px; border: none; font-size: 20px; cursor: pointer;" onclick="repeatTask()">repeat task 100 times</button>
    <button style="padding: 10px 20px; background: rgb(141, 34, 34); color:white; border-radius: 20px; border: none; font-size: 20px; cursor: pointer;" onclick="clearTask()">clear all</button>
    </div>
    <div id="body"></div>
</body>
<script src="script.js"></script>
</html>
